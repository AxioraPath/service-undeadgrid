# Nginx para Undead Grid: sirve el frontend estático y hace de reverse proxy
# (incluido WebSocket) hacia el backend NestJS en 127.0.0.1:3000.
#
# Instalar en el VPS como: /etc/nginx/sites-available/undeadgrid
#   sudo ln -s /etc/nginx/sites-available/undeadgrid /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

# Mapa para el upgrade de WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream undeadgrid_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name 149.56.96.84;  # cambiar por el dominio cuando exista

    root /var/www/undeadgrid/web;
    index index.html;

    # Compresión: carga rápida del front (mejor experiencia/FPS iniciales).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # Assets con hash de Vite: cache agresivo e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # WebSocket / Socket.IO -> backend. Clave para ping bajo y estable.
    location /socket.io/ {
        proxy_pass http://undeadgrid_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Timeouts largos: un socket puede estar inactivo entre fases.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Sin buffering para empujar los eventos en tiempo real.
        proxy_buffering off;
    }

    # API REST y health -> backend.
    location /api/ {
        proxy_pass http://undeadgrid_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://undeadgrid_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # SPA: cualquier otra ruta sirve index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
